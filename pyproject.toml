[project]
name = "voxstream"
version = "0.1.0"
description = "Local Spanish TTS streaming service over WebSocket (Kokoro-ONNX)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "websockets>=13",
    "pydantic>=2",
    "pydantic-settings>=2",
    "kokoro-onnx",
    "onnxruntime",
    "numpy",
]

[project.optional-dependencies]
verify = ["faster-whisper", "jiwer", "scipy"]

[project.scripts]
voxstream = "voxstream.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voxstream"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = '-m "not model"'
markers = [
    "model: loads Kokoro or the recognition model (excluded by default)",
    "slow: slow tests",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["kokoro_onnx.*", "faster_whisper.*", "jiwer.*", "onnxruntime.*", "scipy.*"]
ignore_missing_imports = true
